<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agile Pipeline Demo</title>
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>TaskFlow Lite - Agile Pipeline Project</h1>
      <p>Website sederhana untuk demo proses GitFlow + CI Automation Test</p>
    </header>

    <main class="container">
      <section class="card">
        <h2>Input Task</h2>
        <form id="task-form">
          <input id="task-title" type="text" placeholder="Nama task" required />
          <input id="task-owner" type="text" placeholder="PIC" />
          <button type="submit">Tambah</button>
        </form>
      </section>

      <section class="board">
        <article class="card column">
          <h2>Todo</h2>
          <ul id="todo-list" class="task-list"></ul>
        </article>

        <article class="card column">
          <h2>Doing</h2>
          <ul id="doing-list" class="task-list"></ul>
        </article>

        <article class="card column">
          <h2>Done</h2>
          <ul id="done-list" class="task-list"></ul>
        </article>
      </section>
    </main>

    <footer class="footer">
      <p>Pipeline check: lint, unit test, build artifact upload.</p>
    </footer>

    <script type="module" src="src/js/app.js"></script>
  </body>
</html>
